<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunchFlow | 質感點餐美學</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Firebase Libraries -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, query, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lunch-flow-default';
        const apiKey = ""; 

        // UI State
        let user = null;
        let menuItems = [];
        let orders = [];
        let isAdmin = false;
        let selectedItemId = "";
        let editingOrderId = null;
        let systemTitle = "LUNCHFLOW";

        window.onload = async () => {
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (error) {
                    console.error("Auth Error", error);
                }
            };
            
            await initAuth();

            onAuthStateChanged(auth, (u) => {
                user = u;
                if (user) {
                    setupListeners();
                }
            });

            document.addEventListener('click', (e) => {
                const searchContainer = document.getElementById('search-container');
                if (searchContainer && !searchContainer.contains(e.target)) {
                    document.getElementById('search-results').classList.add('hidden');
                }
            });
        };

        function setupListeners() {
            if (!user) return;

            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
            onSnapshot(settingsRef, (docSnap) => {
                if (docSnap.exists()) {
                    systemTitle = docSnap.data().title || "LUNCHFLOW";
                    updateSystemTitleUI();
                }
            }, (err) => console.error(err));

            const menuRef = collection(db, 'artifacts', appId, 'public', 'data', 'menu');
            onSnapshot(menuRef, (snapshot) => {
                menuItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderMenu();
                checkVegetarian();
            }, (err) => console.error(err));

            const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
            onSnapshot(ordersRef, (snapshot) => {
                orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderOrders();
            }, (err) => console.error(err));
        }

        function updateSystemTitleUI() {
            const titleElements = document.querySelectorAll('.dynamic-title');
            titleElements.forEach(el => el.innerText = systemTitle);
            const titleInput = document.getElementById('system-title-input');
            if (titleInput) titleInput.value = systemTitle;
            document.title = `${systemTitle} | 質感點餐美學`;
        }

        window.updateSystemTitle = async () => {
            const newTitle = document.getElementById('system-title-input').value.trim();
            if (!newTitle) return;
            try {
                const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
                await setDoc(settingsRef, { title: newTitle }, { merge: true });
                showSuccessToast("系統標題修改成功！");
            } catch (error) {
                console.error(error);
                showModal("錯誤", "修改標題失敗。");
            }
        };

        window.processMenuImage = async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64Data = e.target.result.split(',')[1];
                const loadingModal = document.getElementById('ai-loading');
                loadingModal.classList.remove('hidden');
                try {
                    const prompt = "請辨識這張菜單圖片，提取所有餐點名稱與價格。請以 JSON 格式回傳，結構為：{ items: [{ name: string, price: number }] }。只回傳 JSON 內容，不要有其他文字。";
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inlineData: { mimeType: file.type, data: base64Data } }
                                ]
                            }]
                        })
                    });
                    const result = await response.json();
                    const textResponse = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    const cleanJson = textResponse.replace(/```json|```/g, '').trim();
                    const menuData = JSON.parse(cleanJson);
                    if (menuData.items && menuData.items.length > 0) {
                        const batch = writeBatch(db);
                        menuData.items.forEach(item => {
                            const newDocRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'menu'));
                            batch.set(newDocRef, { name: item.name, price: item.price });
                        });
                        await batch.commit();
                        showModal("成功", `AI 已成功辨識並匯入 ${menuData.items.length} 個品項！`);
                    }
                } catch (error) {
                    console.error("AI Error:", error);
                    showModal("錯誤", "AI 辨識失敗，請確保圖片清晰或檢查網路連線。");
                } finally {
                    loadingModal.classList.add('hidden');
                    event.target.value = ''; 
                }
            };
            reader.readAsDataURL(file);
        };

        window.toggleDropdown = () => {
            const resultsContainer = document.getElementById('search-results');
            if (resultsContainer.classList.contains('hidden')) {
                filterItems(document.getElementById('item-search-input').value);
            } else {
                resultsContainer.classList.add('hidden');
            }
        };

        window.filterItems = (keyword) => {
            const resultsContainer = document.getElementById('search-results');
            const list = document.getElementById('search-list');
            resultsContainer.classList.remove('hidden');
            let filtered = menuItems;
            if (keyword.trim()) {
                filtered = menuItems.filter(item => item.name.toLowerCase().includes(keyword.toLowerCase()));
            }
            if (filtered.length > 0) {
                list.innerHTML = filtered.map((item, index) => `
                    <div onclick="selectItem('${item.id}', '${item.name}', ${item.price})" 
                         class="p-4 hover:bg-rose-50 cursor-pointer border-b border-rose-50 last:border-0 flex justify-between items-center transition-colors group">
                        <div class="flex flex-col">
                            <span class="font-bold text-gray-800">${item.name}</span>
                            ${index < 3 && !keyword ? '<span class="text-[10px] text-orange-500 font-bold">🏆 人氣推薦</span>' : ''}
                        </div>
                        <span class="text-rose-500 font-serif font-bold">$${item.price}</span>
                    </div>
                `).join('');
            } else {
                list.innerHTML = `<div class="p-8 text-gray-400 text-center italic">找不到相關品項</div>`;
            }
        };

        window.selectItem = (id, name, price) => {
            selectedItemId = id;
            const input = document.getElementById('item-search-input');
            input.value = `${name}`;
            document.getElementById('display-price').innerText = `$${price}`;
            document.getElementById('search-results').classList.add('hidden');
            input.classList.add('border-rose-500', 'bg-rose-50');
        };

        window.toggleAdmin = () => {
            isAdmin = !isAdmin;
            document.getElementById('admin-panel').classList.toggle('hidden', !isAdmin);
            document.getElementById('admin-toggle-btn').innerText = isAdmin ? "返回點餐" : "管理介面";
        };

        window.submitOrder = async () => {
            const userName = document.getElementById('order-user-name').value;
            const quantityInput = document.getElementById('order-quantity');
            const quantity = parseInt(quantityInput.value);
            const note = document.getElementById('order-note').value;
            if (!userName || !selectedItemId) {
                showModal("提示", "請填寫姓名並選擇餐點。");
                return;
            }
            if (isNaN(quantity) || quantity <= 0) {
                showModal("提示", "請輸入有效的份數。");
                return;
            }
            const item = menuItems.find(i => i.id === selectedItemId);
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), {
                userName, itemName: item.name, price: item.price, quantity, note, timestamp: Date.now()
            });
            selectedItemId = "";
            document.getElementById('item-search-input').value = "";
            document.getElementById('display-price').innerText = "";
            document.getElementById('item-search-input').classList.remove('border-rose-500', 'bg-rose-50');
            document.getElementById('order-note').value = '';
            quantityInput.value = "1"; // 重置數量為預設值 1
            showSuccessToast("已成功為您紀錄點餐！");
        };

        window.deleteOrder = async (orderId) => {
            if (await showModal("確認刪除", "確定要刪除這筆點餐嗎？", true)) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId));
            }
        };

        window.editOrder = (orderId) => {
            editingOrderId = orderId;
            renderOrders();
        };

        window.cancelEditOrder = () => {
            editingOrderId = null;
            renderOrders();
        };

        window.saveOrderEdit = async (orderId) => {
            const qtyInput = document.getElementById(`edit-qty-${orderId}`);
            const newQty = parseInt(qtyInput.value);
            const newNote = document.getElementById(`edit-note-${orderId}`).value;
            
            if (isNaN(newQty) || newQty <= 0) {
                showModal("提示", "請輸入有效的份數。");
                return;
            }

            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId), {
                    quantity: newQty,
                    note: newNote
                });
                editingOrderId = null;
                showSuccessToast("訂單修改成功！");
            } catch (error) {
                showModal("錯誤", "更新失敗，請稍後再試。");
            }
        };

        window.addMenuItem = async () => {
            const name = document.getElementById('new-item-name').value;
            const price = parseInt(document.getElementById('new-item-price').value);
            if (!name || isNaN(price)) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'menu'), { name, price });
            document.getElementById('new-item-name').value = '';
            document.getElementById('new-item-price').value = '';
            showSuccessToast("品項新增成功！");
        };

        window.updateMenuItem = async (id) => {
            const newName = document.getElementById(`edit-name-${id}`).value;
            const newPrice = parseInt(document.getElementById(`edit-price-${id}`).value);
            if (!newName || isNaN(newPrice)) {
                showModal("提示", "名稱與價格不能為空！");
                return;
            }
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'menu', id), { 
                    name: newName, 
                    price: newPrice 
                });
                showSuccessToast("菜單名稱與價格修改成功！");
            } catch (error) {
                showModal("錯誤", "更新失敗，請稍後再試。");
            }
        };
        
        window.deleteMenuItem = async (id) => {
            if (await showModal("確認刪除", "確定要刪除這個品項嗎？", true)) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'menu', id));
                showSuccessToast("品項已成功刪除！");
            }
        };

        function showSuccessToast(message = "操作成功！") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('hidden');
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function showModal(title, message, isConfirm = false) {
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-modal');
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                const btnCancel = document.getElementById('modal-cancel');
                const btnConfirm = document.getElementById('modal-confirm');
                btnCancel.classList.toggle('hidden', !isConfirm);
                modal.classList.remove('hidden');
                btnConfirm.onclick = () => { modal.classList.add('hidden'); resolve(true); };
                btnCancel.onclick = () => { modal.classList.add('hidden'); resolve(false); };
            });
        }

        function checkVegetarian() {
            const hasVeg = menuItems.some(i => i.name.includes("素") || i.name.includes("蔬"));
            document.getElementById('veg-warning').classList.toggle('hidden', hasVeg || menuItems.length === 0);
        }

        function renderMenu() {
            const adminList = document.getElementById('admin-menu-list');
            adminList.innerHTML = menuItems.map(i => `
                <div class="flex items-center gap-2 bg-white p-3 rounded-xl border border-rose-100 shadow-sm">
                    <input type="text" id="edit-name-${i.id}" value="${i.name}" class="flex-1 focus:outline-none focus:bg-rose-50 rounded px-2 text-gray-800 py-1 transition-colors border border-transparent focus:border-rose-200" placeholder="品項名稱">
                    <input type="number" id="edit-price-${i.id}" value="${i.price}" class="w-20 focus:outline-none focus:bg-rose-50 rounded text-rose-600 font-bold py-1 text-center transition-colors border border-transparent focus:border-rose-200" placeholder="價格">
                    <div class="flex gap-1 ml-1">
                        <button onclick="updateMenuItem('${i.id}')" class="p-2 text-emerald-500 hover:text-white hover:bg-emerald-500 bg-emerald-50 rounded-lg transition-colors" title="儲存修改">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                        <button onclick="deleteMenuItem('${i.id}')" class="p-2 text-rose-400 hover:text-white hover:bg-rose-500 bg-rose-50 rounded-lg transition-colors" title="刪除">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderOrders() {
            const list = document.getElementById('order-summary-list');
            const totalEl = document.getElementById('total-amount');
            let total = 0;
            if (orders.length === 0) {
                list.innerHTML = `<p class="text-center py-10 text-gray-400 italic">目前尚未有同仁點餐</p>`;
                totalEl.innerText = `$0`;
                return;
            }
            
            list.innerHTML = orders.sort((a,b) => b.timestamp - a.timestamp).map(o => {
                total += (o.price * o.quantity);
                if (editingOrderId === o.id) {
                    return `
                        <div class="py-5 border-b border-rose-100/50 last:border-0 bg-rose-50/60 px-4 -mx-4 rounded-2xl animate-fade-in shadow-inner">
                            <div class="flex justify-between items-center mb-4">
                                <span class="font-bold text-gray-800">${o.userName} <span class="text-gray-400 font-normal">正在修改</span> <span class="text-rose-600">${o.itemName}</span></span>
                            </div>
                            <div class="flex gap-3 mb-4">
                                <div class="w-24">
                                    <label class="block text-[10px] font-black text-rose-300 uppercase tracking-widest mb-1">份數</label>
                                    <input id="edit-qty-${o.id}" type="number" min="1" value="${o.quantity}" 
                                           class="w-full p-2 bg-white rounded-xl border-2 border-rose-100 text-center text-rose-600 font-bold focus:border-rose-400 outline-none">
                                </div>
                                <div class="flex-1">
                                    <label class="block text-[10px] font-black text-rose-300 uppercase tracking-widest mb-1">特殊需求</label>
                                    <input id="edit-note-${o.id}" type="text" value="${o.note || ''}" class="w-full p-2 bg-white rounded-xl border-2 border-rose-100 focus:border-rose-400 outline-none placeholder-gray-300" placeholder="備註...">
                                </div>
                            </div>
                            <div class="flex justify-end gap-2">
                                <button onclick="cancelEditOrder()" class="px-4 py-2 text-xs font-bold text-gray-500 hover:bg-gray-100 rounded-xl transition-colors">取消</button>
                                <button onclick="saveOrderEdit('${o.id}')" class="px-5 py-2 text-xs font-bold bg-rose-500 text-white hover:bg-rose-600 rounded-xl shadow-md shadow-rose-200 transition-colors">儲存修改</button>
                            </div>
                        </div>
                    `;
                }
                return `
                    <div class="flex justify-between items-start py-5 border-b border-rose-100/50 last:border-0 animate-fade-in group hover:bg-rose-50/30 px-2 -mx-2 rounded-xl transition-all">
                        <div class="flex-1">
                            <span class="font-bold text-gray-800 block mb-1 text-lg">${o.userName}</span>
                            <div class="flex items-center gap-2">
                                <span class="bg-rose-100 text-rose-700 px-3 py-1 rounded-lg font-bold">${o.itemName}</span>
                                <span class="text-gray-500 font-medium">x ${o.quantity}</span>
                            </div>
                            ${o.note ? `<p class="text-gray-400 text-sm mt-2">註：${o.note}</p>` : ''}
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="text-2xl font-serif text-rose-500 font-bold">$${o.price * o.quantity}</span>
                            <div class="flex items-center gap-3 mt-1">
                                <button onclick="editOrder('${o.id}')" class="text-gray-400 hover:text-blue-500 text-xs font-bold transition-colors flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    修改
                                </button>
                                <button onclick="deleteOrder('${o.id}')" class="text-gray-400 hover:text-red-500 text-xs font-bold transition-colors flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    刪除
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            totalEl.innerText = `$${total}`;
        }
    </script>
    <style>
        :root { --rose-primary: #F43F5E; --bg-color: #FFF1F2; }
        body { background-color: var(--bg-color); color: #334155; font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; }
        .serif { font-family: 'Noto Serif TC', serif; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 40px -10px rgba(244, 63, 94, 0.1); }
        .input-pink { background: #FFFFFF; border: 2px solid #FFE4E6; transition: all 0.2s ease; }
        .input-pink:focus { border-color: #FB7185; outline: none; box-shadow: 0 0 0 3px rgba(251, 113, 133, 0.1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
        .spinner { border: 3px solid rgba(244, 63, 94, 0.1); border-left-color: #F43F5E; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { opacity: 1; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
        <header class="text-center mb-10 pt-4">
            <h1 class="serif text-4xl md:text-5xl font-bold text-rose-500 tracking-widest mb-2 dynamic-title uppercase">LUNCHFLOW</h1>
            <p class="text-rose-400/80 tracking-widest text-sm font-semibold uppercase italic">Elevated Dining Choice</p>
        </header>

        <div class="flex justify-end mb-6">
            <button id="admin-toggle-btn" onclick="toggleAdmin()" class="text-xs font-bold border-2 border-rose-200 text-rose-500 px-5 py-2 rounded-full transition-all hover:bg-rose-50">
                管理介面
            </button>
        </div>

        <!-- Admin Panel -->
        <section id="admin-panel" class="hidden mb-10 animate-fade-in">
            <div class="glass-card p-6 rounded-3xl space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="serif text-2xl text-rose-600 font-bold">管理控制台</h2>
                    <label class="cursor-pointer bg-rose-50 text-rose-600 px-4 py-2 rounded-xl text-xs font-bold border border-rose-100 hover:bg-rose-100 transition-colors flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        AI 匯入菜單圖片
                        <input type="file" class="hidden" accept="image/*" onchange="processMenuImage(event)">
                    </label>
                </div>

                <div class="p-5 bg-rose-50/50 rounded-2xl border border-rose-100">
                    <label class="block text-xs font-black text-rose-300 uppercase tracking-widest mb-2">修改系統名稱 (取代 LUNCHFLOW)</label>
                    <div class="flex gap-2">
                        <input id="system-title-input" type="text" placeholder="輸入新的名稱" class="input-pink flex-1 p-3 rounded-xl text-sm">
                        <button onclick="updateSystemTitle()" class="bg-emerald-500 text-white font-bold px-5 py-3 rounded-xl text-sm hover:bg-emerald-600 transition-colors shadow-lg shadow-emerald-100">
                            儲存標題
                        </button>
                    </div>
                </div>

                <hr class="border-rose-100">

                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input id="new-item-name" type="text" placeholder="品項名稱" class="input-pink p-3 rounded-xl col-span-2 text-sm">
                    <input id="new-item-price" type="number" placeholder="價格" class="input-pink p-3 rounded-xl text-sm">
                    <button onclick="addMenuItem()" class="bg-rose-500 text-white font-bold p-3 rounded-xl text-sm hover:bg-rose-600 transition-colors">新增品項</button>
                </div>
                <div id="admin-menu-list" class="grid grid-cols-1 gap-2 max-h-60 overflow-y-auto pr-2"></div>
                <p class="text-[10px] text-gray-400 text-center mt-2">修改品項後，請點擊綠色打勾按鈕儲存</p>
            </div>
        </section>

        <!-- User Order Form -->
        <section class="mb-10 space-y-6">
            <div id="veg-warning" class="hidden bg-amber-50 border border-amber-200 text-amber-700 p-4 rounded-2xl text-xs flex items-center gap-3">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"></path></svg>
                <span>今日菜單似乎尚未加入素食，請貼心提醒茹素同仁。</span>
            </div>

            <div class="glass-card p-6 md:p-10 rounded-[2.5rem] space-y-8">
                <div class="flex justify-between items-center">
                    <h2 class="serif text-3xl text-rose-600 font-bold">立即點餐</h2>
                    <span id="display-price" class="text-2xl font-serif text-rose-400 font-bold"></span>
                </div>

                <div class="space-y-6">
                    <div>
                        <label class="block text-xs font-black text-rose-300 uppercase tracking-widest mb-2">你的姓名</label>
                        <input id="order-user-name" type="text" placeholder="輸入同仁姓名" class="input-pink w-full p-4 rounded-2xl text-lg font-medium">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="md:col-span-3 relative" id="search-container">
                            <label class="block text-xs font-black text-rose-300 uppercase tracking-widest mb-2">選擇餐點</label>
                            <div class="relative group">
                                <input id="item-search-input" type="text" 
                                       onclick="toggleDropdown()"
                                       oninput="filterItems(this.value)" 
                                       placeholder="點擊瀏覽或搜尋..." 
                                       autocomplete="off"
                                       class="input-pink w-full p-4 pr-12 rounded-2xl text-lg font-medium cursor-pointer">
                                <button onclick="toggleDropdown()" class="absolute right-4 top-1/2 -translate-y-1/2 text-rose-300 hover:text-rose-500 transition-colors">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </button>
                            </div>
                            <div id="search-results" class="hidden absolute top-full left-0 right-0 mt-3 bg-white rounded-3xl shadow-2xl border border-rose-50 z-[60] max-h-72 overflow-y-auto animate-fade-in ring-8 ring-black/5">
                                <div id="search-list" class="flex flex-col"></div>
                            </div>
                        </div>

                        <div class="md:col-span-1">
                            <label class="block text-xs font-black text-rose-300 uppercase tracking-widest mb-2">份數</label>
                            <input id="order-quantity" type="number" min="1" value="1" 
                                   class="input-pink w-full p-4 rounded-2xl text-lg font-medium text-center">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-black text-rose-300 uppercase tracking-widest mb-2">特殊需求</label>
                        <input id="order-note" type="text" placeholder="例如：飯少、不加洋蔥..." class="input-pink w-full p-4 rounded-2xl">
                    </div>
                </div>

                <button onclick="submitOrder()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-6 rounded-3xl text-xl shadow-xl shadow-rose-200 transition-all active:scale-95">
                    確認送出
                </button>
            </div>
        </section>

        <!-- Order Summary -->
        <section class="animate-fade-in mb-20">
            <div class="glass-card p-6 md:p-10 rounded-[2.5rem]">
                <div class="flex justify-between items-end mb-8 border-b border-rose-100 pb-6">
                    <h2 class="serif text-3xl text-rose-600 font-bold">點餐清單</h2>
                    <div class="text-right">
                        <p class="text-[10px] text-rose-300 font-black uppercase mb-1 tracking-tighter">Subtotal Amount</p>
                        <p id="total-amount" class="text-4xl serif text-rose-500 font-bold leading-none">$0</p>
                    </div>
                </div>
                <div id="order-summary-list" class="flex flex-col"></div>
            </div>
        </section>

        <footer class="mt-8 text-center text-rose-300 text-[10px] font-black tracking-[0.3em] pb-10 uppercase">
            <span class="dynamic-title">LUNCHFLOW</span> Aesthetics • Crafted for Better Workdays
        </footer>
    </div>

    <!-- AI Loading Overlay -->
    <div id="ai-loading" class="hidden fixed inset-0 bg-rose-950/40 backdrop-blur-md z-[300] flex flex-col items-center justify-center text-white">
        <div class="bg-white p-8 rounded-[2.5rem] flex flex-col items-center shadow-2xl">
            <div class="spinner mb-4"></div>
            <p class="text-rose-600 font-bold serif">AI 正在努力分析菜單...</p>
            <p class="text-rose-300 text-xs mt-2">這可能需要幾秒鐘的時間</p>
        </div>
    </div>

    <!-- Toast & Modals -->
    <div id="toast" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 bg-rose-600 text-white px-10 py-4 rounded-full shadow-2xl font-bold animate-fade-in z-[100] flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-message">操作成功！</span>
    </div>

    <div id="custom-modal" class="hidden fixed inset-0 bg-rose-950/20 backdrop-blur-sm z-[200] flex items-center justify-center">
        <div class="bg-white p-8 rounded-[2rem] max-w-sm w-full mx-4 shadow-2xl border border-rose-50">
            <h3 id="modal-title" class="text-xl font-bold text-rose-600 mb-2 serif"></h3>
            <p id="modal-message" class="text-gray-500 mb-8 text-sm leading-relaxed"></p>
            <div class="flex justify-end gap-2">
                <button id="modal-cancel" class="px-6 py-2 text-gray-400 font-bold text-sm">取消</button>
                <button id="modal-confirm" class="px-8 py-2 bg-rose-500 text-white rounded-xl font-bold text-sm shadow-lg shadow-rose-200">確定</button>
            </div>
        </div>
    </div>

</body>
</html>
