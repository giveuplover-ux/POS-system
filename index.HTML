<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>NEO-SALE | 智慧販售系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-[#020617] text-slate-100 min-h-screen font-sans">
    <nav
      class="fixed top-0 w-full z-50 bg-[#020617]/80 backdrop-blur-xl border-b border-slate-800/50"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between"
      >
        <div
          class="flex items-center space-x-3 cursor-pointer"
          onclick="switchView('home')"
        >
          <div
            class="w-10 h-10 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center"
          >
            <i data-lucide="package" class="text-white w-6 h-6"></i>
          </div>
          <span class="text-2xl font-black tracking-tighter">NEO-SALE</span>
        </div>
        <div class="flex items-center space-x-4">
          <button
            onclick="switchView('dashboard')"
            class="text-slate-400 hover:text-white font-bold"
          >
            數據中心
          </button>
          <button
            onclick="switchView('cart')"
            class="relative p-3 bg-slate-900 rounded-xl"
          >
            <i data-lucide="shopping-cart" class="w-6 h-6"></i>
            <span
              id="cart-count"
              class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full hidden"
              >0</span
            >
          </button>
        </div>
      </div>
    </nav>
    <main id="view-container" class="pt-32 pb-20 px-6 max-w-7xl mx-auto"></main>
    <script src="script.js"></script>
  </body>
</html>
